<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка Base64 Изображения и JSON</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 40px; display: flex; flex-direction: column; align-items: center; }
        button { background-color: #4a90e2; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 25px; transition: background 0.2s; }
        button:hover { background-color: #357abd; }
        
        /* Стили для карточки, куда прилетят данные */
        .product-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; overflow: hidden; display: none; text-align: center; padding-bottom: 20px; }
        .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #e9ecef; }
        .product-title { font-size: 20px; margin: 15px 0 10px 0; color: #333; }
        .product-price { font-size: 18px; color: #2ecc71; font-weight: bold; margin: 0; }
        
        .loader { display: none; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <h1>Динамическая подстановка данных и Base64</h1>
    <button id="load-data-btn">Получить данные с API</button>
    
    <div id="loader" class="loader">Загрузка данных и генерация картинки...</div>

    <!-- Шаблон карточки, заполняется через JS -->
    <div id="card-container" class="product-card">
        <!-- Сюда вставим картинку -->
        <img id="product-image" class="product-img" src="" alt="Изображение товара">
        <!-- Сюда вставим текст -->
        <h3 id="product-title" class="product-title"></h3>
        <p id="product-price" class="product-price"></p>
    </div>

    <!-- Подключаем логику -->
    <script src="app.js"></script>
</body>
</html>
